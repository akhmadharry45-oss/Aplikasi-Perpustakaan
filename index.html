<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12361F">
<title>Perpustakaan SD Negeri 1 Barabai Timur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: deep-green fixed sidebar, sticky top bar, one content column; wide tables scroll inside their own panel. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#EAEFE7; --line:#D9E1D6;
  --fg:#16261B; --muted:#5A6B5E;
  --primary:#1E6B3C; --on-primary:#FFFFFF; --primary-soft:#DDEDE0; --primary-ink:#17512D;
  --accent:#E5A11A; --accent-soft:#FBEFCD; --accent-ink:#6A4700;
  --danger:#B63A27; --danger-soft:#F8DFD9; --danger-ink:#8E2A1A;
  --info:#2B6E98; --info-soft:#DCEBF4; --info-ink:#1E5273;
  --side-bg:#12361F; --side-fg:#CFE2D3; --side-muted:#8FB09A; --side-hover:rgba(255,255,255,.07); --side-active:rgba(255,255,255,.13);
  --scrim:rgba(12,24,16,.55); --shadow:0 12px 40px rgba(10,30,18,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1712; --surface:#17231B; --surface-2:#1F2F25; --line:#2C3F32;
    --fg:#E6EEE7; --muted:#9CAFA0;
    --primary:#52B476; --on-primary:#07170D; --primary-soft:#1F3B2A; --primary-ink:#8FD7A9;
    --accent:#F0B43C; --accent-soft:#3A2E10; --accent-ink:#F3CF7A;
    --danger:#F08A78; --danger-soft:#3E1D17; --danger-ink:#F4A798;
    --info:#7FB8DB; --info-soft:#16303F; --info-ink:#A8D2EA;
    --side-bg:#0B1A11; --side-fg:#C9DDCD; --side-muted:#7E9C88;
    --scrim:rgba(0,0,0,.65); --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17231B; --surface-2:#1F2F25; --line:#2C3F32;
  --fg:#E6EEE7; --muted:#9CAFA0;
  --primary:#52B476; --on-primary:#07170D; --primary-soft:#1F3B2A; --primary-ink:#8FD7A9;
  --accent:#F0B43C; --accent-soft:#3A2E10; --accent-ink:#F3CF7A;
  --danger:#F08A78; --danger-soft:#3E1D17; --danger-ink:#F4A798;
  --info:#7FB8DB; --info-soft:#16303F; --info-ink:#A8D2EA;
  --side-bg:#0B1A11; --side-fg:#C9DDCD; --side-muted:#7E9C88;
  --scrim:rgba(0,0,0,.65); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3,p{margin:0}
h2,h3{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;padding:20px 12px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));z-index:20;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#2A1C00;display:grid;place-items:center}
.brand-mark .i{width:22px;height:22px}
.brand b{display:block;font-family:var(--font-display);font-size:19px;letter-spacing:.06em;color:#fff;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--side-muted);line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--side-fg);font-weight:500;text-align:left;cursor:pointer}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav button[aria-current="page"] .i{color:var(--accent)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:var(--side-muted);line-height:1.4}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:600}
.grow{flex:1}
.menu-btn{display:none}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.sync.warn i{background:var(--accent)}
.sync.off i{background:var(--danger)}
.content{width:100%;max-width:1240px;margin-inline:auto;padding-block:24px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;flex:1}
.foot{padding:16px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.ib{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;gap:6px}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.ib.del:hover,.ib.armed{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger)}
.ib.ok{color:var(--primary-ink);background:var(--primary-soft);border-color:transparent}
.ib.wide{display:inline-flex;align-items:center}
.ops{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.search{position:relative;display:flex;align-items:center;min-width:0;flex:1 1 240px;max-width:380px}
.search .i{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search input{padding-left:36px}
input,select{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0}
input::placeholder{color:var(--muted);opacity:.8}
select{appearance:auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600}
.req{color:var(--danger)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink)}

/* page blocks */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.ph h2{font-size:26px;font-weight:700;line-height:1.15}
.sub{color:var(--muted);margin-top:4px;max-width:62ch}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 18px 0}
.panel-h h3{font-size:16px;font-weight:700}
.panel-b{padding:16px 18px 18px}
.toolbar{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;padding:14px 18px 0}
.tablewrap{overflow-x:auto;padding:10px 6px 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.t{min-width:200px}
th.r,td.r{text-align:right}
.empty{padding:34px 18px;text-align:center;color:var(--muted);max-width:52ch;margin-inline:auto}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:16px;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--primary-soft);color:var(--primary-ink)}
.chip.warn{background:var(--accent-soft);color:var(--accent-ink)}
.chip.bad{background:var(--danger-soft);color:var(--danger-ink)}
.chip.info{background:var(--info-soft);color:var(--info-ink)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.bc{display:inline-block;background:#fff;padding:3px 6px;border-radius:4px;line-height:0;border:1px solid var(--line)}
.bc svg{height:26px;width:auto;max-width:110px}
.notice{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:12px 16px;font-size:13px}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{display:flex;gap:14px;align-items:center;padding:18px;border-radius:12px;border:1px solid transparent}
.tile-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);flex:none}
.tile-ico .i{width:22px;height:22px}
.tile-k{font-size:12.5px;font-weight:600}
.tile-v{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile-s{font-size:12px;opacity:.85}
.t-green{background:var(--primary-soft);color:var(--primary-ink)}
.t-blue{background:var(--info-soft);color:var(--info-ink)}
.t-amber{background:var(--accent-soft);color:var(--accent-ink)}
.t-red{background:var(--danger-soft);color:var(--danger-ink)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.chartbox{position:relative;height:250px}
.msg{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center}
.bars{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:90px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bars .tr{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--primary);border-radius:6px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;min-height:0}
.modal.wide{max-width:600px}
.modal form{display:flex;flex-direction:column;min-height:0}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.form-err{color:var(--danger-ink);background:var(--danger-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--danger);color:#fff}

/* member card (kept light, like a printed card, in both themes) */
.idcard{background:#fff;color:#1B2A1F;border-radius:10px;overflow:hidden;border:1px solid var(--line);width:100%;max-width:520px;margin-inline:auto}
.idcard-h{background:#1E6B3C;color:#fff;display:flex;gap:14px;align-items:center;padding:14px 16px}
.idcard-h svg{width:54px;height:54px;flex:none}
.idcard-h small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.idcard-h b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.15;letter-spacing:.01em}
.idcard-h span{display:block;font-size:10.5px;opacity:.85;margin-top:3px;line-height:1.3}
.idcard-b{padding:16px 18px 6px;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;font-size:13.5px}
.idcard-b dt{color:#3D5043}
.idcard-b dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.idcard-f{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;padding:12px 18px 16px;background:linear-gradient(#fff,#CFE4D3);font-size:13px}
.qrbox{background:#fff;padding:7px;border-radius:6px;line-height:0;width:118px;height:118px}
.qrbox img,.qrbox canvas{max-width:100%;height:auto}
.sign{text-align:left;min-width:0}
.sign p{color:#3D5043}
.sign b{display:block;margin-top:34px;font-size:13.5px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(280px,86vw);padding-top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-grid}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .ph h2{font-size:22px}
}
@media (max-width:520px){
  .row2{grid-template-columns:minmax(0,1fr)}
  .tile{padding:14px}
  .tile-v{font-size:28px}
  .sync span{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.ib.menu-btn{display:none}
.scan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.scan-act{grid-column:1/-1}
.scan-row{display:flex;gap:8px}
.scan-cam{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
#reader{width:100%;max-width:440px;margin-top:14px;border-radius:10px;overflow:hidden}
.scan-name{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.25}
.loanlist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.loanlist li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.petugas span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.notice b{font-weight:700}
.notice .btn{margin-left:6px}
.idcard{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media (max-width:900px){.scan-grid{grid-template-columns:minmax(0,1fr)}.ib.menu-btn{display:inline-grid}}
@media (max-width:520px){.petugas span{max-width:70px}}
@media print{
  body{background:#fff}
  body::before{display:none}
  .side,.top,.foot,.ph-a,.toolbar,.ops,#toast-root,.menu-btn{display:none!important}
  .app{display:block}
  body:has(.modal) .app{display:none!important}
  .scrim{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;border:0;max-width:none}
  .modal-h,.modal-f{display:none}
  .panel{break-inside:avoid}
  .content{padding:0}
}
</style>
</head>

<script>
(function(){
'use strict';

var KEY='pustaka-sdn1-barabai-timur:v1',KEY_P='pustaka-petugas:v1',SALT='pustaka-sdn1bt';
var COLS=['kelas','kategori','buku','anggota','pinjaman','admin'];
var NAV=[['dashboard','Dashboard','home'],['scan','Scan','scan'],['kelas','Kelas','layers'],['kategori','Kategori','tag'],['buku','Data Buku','book'],['pinjaman','Data Pinjaman','swap'],['anggota','Anggota','users'],['riwayat','Riwayat','clock'],['laporan','Laporan','report'],['admin','Admin','shield']];
var TITLES={dashboard:'Dashboard',scan:'Scan',kelas:'Kelas',kategori:'Kategori',buku:'Data Buku',pinjaman:'Data Pinjaman',anggota:'Anggota',riwayat:'Riwayat',laporan:'Laporan',admin:'Admin'};
var MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var SCHOOL_DEFAULT={nama:'SD Negeri 1 Barabai Timur',alamat:'Barabai Timur, Kab. Hulu Sungai Tengah, Kalimantan Selatan',kota:'Barabai',kepala:''};
var LOAN_DAYS=7;
var AKSI={tambah:['Tambah','ok'],ubah:['Ubah','info'],hapus:['Hapus','bad'],pinjam:['Pinjam','warn'],kembali:['Kembali','ok'],sistem:['Sistem','mute']};

var S={kelas:[],kategori:[],buku:[],anggota:[],pinjaman:[],admin:[],setting:null,log:[],lastBackup:null,
  petugas:null,storeOk:true,view:'dashboard',
  q:{buku:'',anggota:'',pinjaman:''},f:{pinjaman:'semua',anggotaKelas:'',riwayat:''},
  lap:{dari:new Date().getFullYear()+'-01-01',sampai:''},charts:[],
  scan:{anggotaId:null,bukuId:null},cam:null,lastScan:'',lastScanT:0};

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
function fmt(s){if(!s)return '–';var p=s.split('-');return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0];}
function fmtDT(t){var d=new Date(t);if(isNaN(d))return '–';return fmt(iso(d))+', '+pad(d.getHours())+'.'+pad(d.getMinutes());}
function dmy(s){return s?s.split('-').reverse().join('-'):'';}
function byId(c,id){return S[c].find(function(x){return x.id===id;});}
function nat(a,b){return String(a==null?'':a).localeCompare(String(b==null?'':b),'id',{numeric:true});}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function icon(n){return '<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function school(){return Object.assign({},SCHOOL_DEFAULT,S.setting||{});}
function nm(c,id,k){var o=byId(c,id);return o?o[k||'nama']:'–';}
function activeLoan(bid){return S.pinjaman.find(function(p){return p.bukuId===bid&&!p.tglKembali;});}
function loanState(p){return p.tglKembali?'kembali':(p.tenggat<today()?'terlambat':'dipinjam');}
function loanChip(p){var s=loanState(p);return s==='kembali'?'<span class="chip ok">Dikembalikan</span>':s==='terlambat'?'<span class="chip bad">Terlambat</span>':'<span class="chip info">Dipinjam</span>';}
function strip(o){var r={};Object.keys(o).forEach(function(k){if(k!=='id')r[k]=o[k];});return r;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function effTheme(){var t=document.documentElement.getAttribute('data-theme');if(t)return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
var toastT=0;
function toast(msg,kind){var r=$('#toast-root');r.innerHTML='<div class="toast '+(kind||'')+'" role="status">'+esc(msg)+'</div>';clearTimeout(toastT);toastT=setTimeout(function(){r.innerHTML='';},3600);}
function saveFile(name,data,mime){
  var blob=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
async function hashPin(pin){
  var text=SALT+':'+pin;
  try{
    var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return pad(b.toString(16));}).join('');
  }catch(e){var h=5381;for(var i=0;i<text.length;i++)h=((h<<5)+h+text.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);}
}

/* ---------- storage (localStorage) ---------- */
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);COLS.forEach(function(c){S[c]=Array.isArray(d[c])?d[c]:[];});S.setting=d.setting||null;S.log=Array.isArray(d.log)?d.log:[];S.lastBackup=d.lastBackup||null;}
    S.petugas=localStorage.getItem(KEY_P)||null;
  }catch(e){S.storeOk=false;}
  if(S.petugas&&!S.admin.some(function(a){return a.nama===S.petugas;}))S.petugas=null;
}
function persist(){
  try{
    var o={versi:1,setting:S.setting,log:S.log,lastBackup:S.lastBackup};
    COLS.forEach(function(c){o[c]=S[c];});
    localStorage.setItem(KEY,JSON.stringify(o));S.storeOk=true;return true;
  }catch(e){S.storeOk=false;toast('Data tidak bisa disimpan di peramban ini. Unduh cadangan sekarang.','err');return false;}
}
function setPetugas(name){S.petugas=name;try{if(name)localStorage.setItem(KEY_P,name);else localStorage.removeItem(KEY_P);}catch(e){}}
function logAdd(aksi,ringkas){S.log.unshift({t:new Date().toISOString(),p:S.petugas||'-',a:aksi,r:ringkas});if(S.log.length>1000)S.log.length=1000;}
function describe(c,d){
  switch(c){
    case 'buku':return 'Buku '+d.kode+' · '+d.judul;
    case 'anggota':return 'Anggota '+d.nama+' ('+d.nisn+')';
    case 'kelas':return 'Kelas: '+d.nama;
    case 'kategori':return 'Kategori: '+d.nama;
    case 'admin':return 'Petugas: '+d.nama;
    case 'pengaturan':return 'Identitas sekolah';
    case 'pinjaman':return nm('anggota',d.anggotaId)+' · '+nm('buku',d.bukuId,'judul');
  }
  return c;
}
function guard(){
  if(S.petugas)return true;
  openPetugas();toast('Pilih petugas dulu agar setiap perubahan tercatat.','err');return false;
}
function put(c,id,data,aksi){
  if(!guard())return false;
  if(c==='pengaturan'){var had=!!S.setting;S.setting=data;logAdd(had?'ubah':'tambah',describe(c,data));}
  else{
    var arr=S[c],i=arr.findIndex(function(x){return x.id===id;}),row=Object.assign({id:id},data);
    if(i>=0)arr[i]=row;else arr.push(row);
    logAdd(aksi||(i>=0?'ubah':'tambah'),describe(c,row));
  }
  var ok=persist();scheduleRender();return ok;
}
function drop(c,id){
  if(!guard())return false;
  var o=byId(c,id);if(!o)return false;
  var r=describe(c,o);S[c]=S[c].filter(function(x){return x.id!==id;});
  logAdd('hapus',r);var ok=persist();scheduleRender();return ok;
}
function patch(c,id,part,aksi){var cur=byId(c,id);if(!cur)return false;return put(c,id,Object.assign(strip(cur),part),aksi);}

/* ---------- forms ---------- */
function kelasOpts(){return S.kelas.slice().sort(function(a,b){return nat(a.nama,b.nama);}).map(function(k){return [k.id,k.nama];});}
function kategoriOpts(){return S.kategori.slice().sort(function(a,b){return nat(a.nama,b.nama);}).map(function(k){return [k.id,k.nama];});}
var FORMS={
  kelas:{title:'Kelas',prefix:'k',fields:[{k:'nama',l:'Nama kelas',ph:'Kelas 1',req:1},{k:'wali',l:'Wali kelas',ph:'Nama wali kelas'}]},
  kategori:{title:'Kategori',prefix:'c',fields:[{k:'nama',l:'Nama kategori',ph:'Buku Cerita',req:1}]},
  admin:{title:'Petugas',prefix:'a',
    fields:[{k:'nama',l:'Nama lengkap',req:1},{k:'username',l:'Nama pengguna',req:1,mono:1},{k:'peran',l:'Peran',type:'select',req:1,ph:'Pilih peran',opts:[['Admin','Admin'],['Petugas','Petugas']]},{k:'pin',l:'PIN (opsional, 4–8 angka)',type:'password',ph:'Kosongkan jika tidak diubah'}],
    prepare:async function(clean){var pin=clean.pin;delete clean.pin;if(pin){if(!/^\d{4,8}$/.test(pin))return 'PIN harus 4 sampai 8 angka.';clean.pinHash=await hashPin(pin);}return null;},
    check:function(d,id){var dup=S.admin.some(function(a){return a.id!==id&&String(a.username).toLowerCase()===d.username.toLowerCase();});return dup?'Nama pengguna '+d.username+' sudah dipakai.':null;}},
  buku:{title:'Buku',prefix:'b',
    fields:[{k:'kode',l:'Kode buku',ph:'BK004',req:1,mono:1},{k:'judul',l:'Judul',req:1},{k:'pengarang',l:'Pengarang'},{k:'tahun',l:'Tahun terbit',type:'number',ph:'2024'},{k:'kelasId',l:'Kelas',type:'select',ph:'Pilih kelas',opts:kelasOpts},{k:'kategoriId',l:'Kategori',type:'select',ph:'Pilih kategori',opts:kategoriOpts}],
    check:function(d,id){var dup=S.buku.some(function(b){return b.id!==id&&String(b.kode).toLowerCase()===d.kode.toLowerCase();});return dup?'Kode buku '+d.kode+' sudah dipakai buku lain.':null;}},
  anggota:{title:'Anggota',prefix:'m',
    fields:[{k:'nisn',l:'NISN',req:1,mono:1,ph:'12345'},{k:'nama',l:'Nama',req:1},{k:'kelasId',l:'Kelas',type:'select',ph:'Pilih kelas',opts:kelasOpts},{k:'jk',l:'Jenis kelamin',type:'select',req:1,ph:'Pilih',opts:[['Laki-Laki','Laki-Laki'],['Perempuan','Perempuan']]},{k:'tempatLahir',l:'Tempat lahir'},{k:'tglLahir',l:'Tanggal lahir',type:'date'}],
    check:function(d,id){var dup=S.anggota.some(function(a){return a.id!==id&&String(a.nisn)===d.nisn;});return dup?'NISN '+d.nisn+' sudah terdaftar.':null;}}
};
var DEPS={
  kelas:function(id){return S.anggota.some(function(a){return a.kelasId===id;})||S.buku.some(function(b){return b.kelasId===id;})?'Kelas ini masih dipakai oleh anggota atau buku.':null;},
  kategori:function(id){return S.buku.some(function(b){return b.kategoriId===id;})?'Kategori ini masih dipakai oleh buku.':null;},
  buku:function(id){return S.pinjaman.some(function(p){return p.bukuId===id;})?'Buku ini punya riwayat peminjaman, jadi tidak bisa dihapus.':null;},
  anggota:function(id){return S.pinjaman.some(function(p){return p.anggotaId===id;})?'Anggota ini punya riwayat peminjaman, jadi tidak bisa dihapus.':null;},
  admin:function(){return S.admin.length<=1?'Harus tersisa minimal satu petugas.':null;},
  pinjaman:function(){return null;}
};

function fieldHTML(f,val){
  var id='f-'+f.k,inner;
  if(f.type==='select'){
    var opts=typeof f.opts==='function'?f.opts():f.opts;
    inner='<select id="'+id+'" name="'+f.k+'"'+(f.req?' required':'')+'><option value="">'+esc(f.ph||'Pilih…')+'</option>'+
      opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(val)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';
  }else{
    inner='<input id="'+id+'" name="'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(val==null?'':val)+'" placeholder="'+esc(f.ph||'')+'"'+(f.req?' required':'')+(f.mono?' class="mono"':'')+' autocomplete="off">';
  }
  return '<div class="field"><label for="'+id+'">'+esc(f.l)+(f.req?' <span class="req">*</span>':'')+'</label>'+inner+'</div>';
}

var lastFocus=null;
function openModal(o){
  closeModal(true);
  lastFocus=document.activeElement;
  var foot=o.footer!==undefined?o.footer:(o.onSubmit?'<button type="button" class="btn ghost" data-act="close-modal">Batal</button><button class="btn primary" type="submit">'+(o.submit||'Simpan')+'</button>':'');
  $('#modal-root').innerHTML='<div class="scrim" data-act="close-modal"><div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="m-title">'+
    '<div class="modal-h"><h3 id="m-title">'+esc(o.title)+'</h3><button type="button" class="ib" data-act="close-modal" aria-label="Tutup">'+icon('x')+'</button></div>'+
    '<form id="m-form" novalidate><div class="modal-b">'+o.body+'<p class="form-err" id="m-err" role="alert" hidden></p></div>'+(foot?'<div class="modal-f">'+foot+'</div>':'')+'</form></div></div>';
  var form=$('#m-form');
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    if(!o.onSubmit)return;
    var data={};new FormData(form).forEach(function(v,k){data[k]=v;});
    var btn=form.querySelector('button[type=submit]');if(btn)btn.disabled=true;
    var err=await o.onSubmit(data);
    if(btn)btn.disabled=false;
    if(err){var el=$('#m-err');el.textContent=err;el.hidden=false;}else closeModal();
  });
  if(o.after)o.after();
  var first=form.querySelector('input,select');if(first)first.focus();else{var b=form.querySelector('button');if(b)b.focus();}
}
function closeModal(silent){
  var r=$('#modal-root');if(!r.innerHTML)return;
  r.innerHTML='';
  if(!silent&&lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus();
}

function openForm(c,id){
  var F=FORMS[c],cur=id?byId(c,id):null,init=cur||{};
  openModal({title:(cur?'Ubah ':'Tambah ')+F.title,
    body:F.fields.map(function(f){return fieldHTML(f,init[f.k]);}).join(''),
    onSubmit:async function(d){
      var clean={};
      for(var i=0;i<F.fields.length;i++){
        var f=F.fields[i],v=String(d[f.k]==null?'':d[f.k]).trim();
        if(f.req&&!v)return f.l+' wajib diisi.';
        clean[f.k]=f.type==='number'?(v===''?null:Number(v)):v;
      }
      var err=F.check?F.check(clean,id):null;if(err)return err;
      if(F.prepare){err=await F.prepare(clean);if(err)return err;}
      var ok=put(c,id||uid(F.prefix),Object.assign({},cur?strip(cur):{},clean));
      return ok?null:'Data belum tersimpan.';
    }});
}
function openLoan(){
  var avail=S.buku.filter(function(b){return !activeLoan(b.id);}).sort(function(a,b){return nat(a.kode,b.kode);});
  if(!S.anggota.length){toast('Tambahkan anggota dulu sebelum mencatat peminjaman.','err');return;}
  if(!avail.length){toast('Semua buku sedang dipinjam atau belum ada buku.','err');return;}
  var t=today();
  var fields=[
    {k:'anggotaId',l:'Peminjam',type:'select',req:1,ph:'Pilih siswa',opts:function(){return S.anggota.slice().sort(function(a,b){return nat(a.nama,b.nama);}).map(function(a){return [a.id,a.nama+' ('+a.nisn+')'];});}},
    {k:'bukuId',l:'Buku',type:'select',req:1,ph:'Pilih buku yang tersedia',opts:function(){return avail.map(function(b){return [b.id,b.kode+' · '+b.judul];});}},
    {k:'tglPinjam',l:'Tanggal pinjam',type:'date',req:1},
    {k:'tenggat',l:'Tenggat kembali',type:'date',req:1}];
  var vals={tglPinjam:t,tenggat:addDays(t,LOAN_DAYS)};
  openModal({title:'Catat Peminjaman',
    body:fields.map(function(f){return fieldHTML(f,vals[f.k]);}).join(''),submit:'Catat',
    after:function(){var a=$('#f-tglPinjam');a.addEventListener('change',function(){if(a.value)$('#f-tenggat').value=addDays(a.value,LOAN_DAYS);});},
    onSubmit:async function(d){
      if(!d.anggotaId||!d.bukuId||!d.tglPinjam||!d.tenggat)return 'Lengkapi semua kolom.';
      if(d.tenggat<d.tglPinjam)return 'Tenggat tidak boleh sebelum tanggal pinjam.';
      if(activeLoan(d.bukuId))return 'Buku ini sudah dipinjam orang lain.';
      var ok=put('pinjaman',uid('p'),{anggotaId:d.anggotaId,bukuId:d.bukuId,tglPinjam:d.tglPinjam,tenggat:d.tenggat,tglKembali:null},'pinjam');
      if(ok)toast('Peminjaman dicatat.');
      return ok?null:'Data belum tersimpan.';
    }});
}
function openSchool(){
  var s=school();
  var fields=[{k:'nama',l:'Nama sekolah',req:1},{k:'alamat',l:'Alamat'},{k:'kota',l:'Kota (untuk tanda tangan kartu)'},{k:'kepala',l:'Nama kepala perpustakaan'}];
  openModal({title:'Identitas Sekolah',body:fields.map(function(f){return fieldHTML(f,s[f.k]);}).join(''),
    onSubmit:async function(d){
      if(!String(d.nama||'').trim())return 'Nama sekolah wajib diisi.';
      var ok=put('pengaturan','sekolah',{nama:d.nama.trim(),alamat:(d.alamat||'').trim(),kota:(d.kota||'').trim(),kepala:(d.kepala||'').trim()});
      return ok?null:'Data belum tersimpan.';
    }});
}

/* ---------- petugas ---------- */
function openPetugas(){
  var has=S.admin.length>0;
  var body=has
    ?fieldHTML({k:'adminId',l:'Petugas',type:'select',req:1,ph:'Pilih nama petugas',opts:function(){return S.admin.slice().sort(function(a,b){return nat(a.nama,b.nama);}).map(function(a){return [a.id,a.nama+(a.peran?' · '+a.peran:'')];});}},S.petugas?(S.admin.find(function(a){return a.nama===S.petugas;})||{}).id:'')+
      fieldHTML({k:'pin',l:'PIN',type:'password',ph:'Kosongkan jika petugas tidak memakai PIN'},'')
    :'<p class="sub">Belum ada petugas. Daftarkan petugas pertama. Nama ini akan tercatat pada setiap perubahan data di menu Riwayat.</p>'+
      fieldHTML({k:'nama',l:'Nama petugas',req:1,ph:'Nama lengkap'},'')+fieldHTML({k:'pin',l:'PIN (opsional, 4–8 angka)',type:'password'},'');
  openModal({title:has?'Masuk sebagai Petugas':'Petugas Pertama',submit:has?'Masuk':'Daftar dan Masuk',body:body,
    onSubmit:async function(d){
      var pin=String(d.pin||'').trim();
      if(has){
        var a=byId('admin',d.adminId);if(!a)return 'Pilih nama petugas.';

/* ---------- scan ---------- */
function handleScan(raw){
  var code=String(raw||'').trim();if(!code)return;
  var a=S.anggota.find(function(x){return String(x.nisn)===code;});
  var b=S.buku.find(function(x){return String(x.kode).toLowerCase()===code.toLowerCase();});
  if(a)S.scan.anggotaId=a.id;
  else if(b)S.scan.bukuId=b.id;
  else{toast('Kode "'+code+'" tidak dikenali sebagai NISN atau kode buku.','err');return;}
  refreshScan();
}
function refreshScan(){var el=$('#scan-result');if(el)el.innerHTML=scanResultHTML();}
function focusScan(){if(window.matchMedia&&matchMedia('(pointer:fine)').matches){var i=$('#scan-in');if(i)i.focus();}}
function camLabel(){return S.cam?icon('x')+' Matikan kamera':icon('camera')+' Nyalakan kamera';}
function updateCamBtn(){var b=$('#cam-btn');if(b)b.innerHTML=camLabel();}
async function camStop(){
  var h=S.cam;S.cam=null;
  if(h){try{await h.stop();h.clear();}catch(e){}}
  var el=$('#reader');if(el)el.hidden=true;updateCamBtn();
}
async function camToggle(){
  if(S.cam){await camStop();return;}
  if(typeof Html5Qrcode==='undefined'){toast('Pemindai kamera gagal dimuat. Periksa koneksi internet.','err');return;}
  var el=$('#reader');el.hidden=false;
  try{
    var h=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128],verbose:false});
    await h.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},function(text){
      var now=Date.now();if(text===S.lastScan&&now-S.lastScanT<2500)return;
      S.lastScan=text;S.lastScanT=now;handleScan(text);
    },function(){});
    S.cam=h;
  }catch(e){el.hidden=true;toast('Kamera tidak bisa dibuka. Izinkan akses kamera, dan buka halaman lewat https.','err');}
  updateCamBtn();
}

  var text='﻿'+rows.map(function(r){return r.map(function(v){v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');

function drawCharts(){
  S.charts.forEach(function(c){try{c.destroy();}catch(e){}});S.charts=[];
  if(S.view!=='dashboard'||typeof Chart==='undefined')return;
  var muted=cssv('--muted'),line=cssv('--line'),prim=cssv('--primary'),acc=cssv('--accent'),surf=cssv('--surface');
  Chart.defaults.font.family="'Plus Jakarta Sans','Segoe UI',sans-serif";Chart.defaults.color=muted;
  var now=new Date(),labels=[],keys=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);labels.push(MONTHS[d.getMonth()]+' '+String(d.getFullYear()).slice(2));keys.push(d.getFullYear()+'-'+pad(d.getMonth()+1));}
  var counts=keys.map(function(k){return S.pinjaman.filter(function(p){return String(p.tglPinjam).slice(0,7)===k;}).length;});
  var b1=$('#box-bulan'),b2=$('#box-jk');

  else{S.charts.push(new Chart($('#ch-bulan'),{type:'bar',data:{labels:labels,datasets:[{label:'Peminjaman',data:counts,backgroundColor:prim,borderRadius:5,maxBarThickness:42}]},options:{animation:false,responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0,stepSize:1},grid:{color:line},border:{display:false}},x:{grid:{display:false},border:{color:line}}}}}));}
  var lk=S.anggota.filter(function(a){return a.jk==='Laki-Laki';}).length,pr=S.anggota.filter(function(a){return a.jk==='Perempuan';}).length;

var raf=0;
function scheduleRender(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render();});}
function render(){
  if(S.view==='scan'&&$('#scan-result')){renderChrome();refreshScan();return;}
  var ae=document.activeElement,keep=ae&&ae.id&&$('#view').contains(ae)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  renderChrome();
  $('#view').innerHTML=VIEWS[S.view]();
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e);}catch(e){}}}

async function go(v){
  if(!VIEWS[v])return;
  if(S.cam)await camStop();
  S.view=v;
  try{history.replaceState(null,'','#'+v);}catch(e){}
  $('#side').classList.remove('open');render();window.scrollTo(0,0);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('pustaka-tema',t);}catch(e){}
  render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act;
  if(act==='close-modal'){if(el.classList.contains('scrim')&&e.target!==el)return;closeModal();return;}
  if(act==='nav'){go(el.dataset.v);return;}
  if(act==='menu'){$('#side').classList.toggle('open');return;}
  if(act==='theme'){setTheme(effTheme()==='dark'?'light':'dark');return;}
  if(act==='petugas'){openPetugas();return;}
  if(act==='add'){if(!guard())return;if(el.dataset.c==='pinjaman')openLoan();else openForm(el.dataset.c);return;}
  if(act==='edit'){if(!guard())return;openForm(el.dataset.c,el.dataset.id);return;}
  if(act==='school'){if(!guard())return;openSchool();return;}
  if(act==='card'){openCard(el.dataset.id);return;}
  if(act==='dl-card'){downloadCard(el.dataset.id);return;}
  if(act==='print'){window.print();return;}
  if(act==='csv'){exportCsv();return;}
  if(act==='backup'){exportBackup();return;}
  if(act==='demo'){loadDemo();return;}
  if(act==='wipe'){openWipe();return;}
  if(act==='cam'){camToggle();return;}
  if(act==='filter'){S.f[el.dataset.key]=el.dataset.val;render();return;}
  if(act==='scan-clear'){S.scan={anggotaId:null,bukuId:null};refreshScan();focusScan();return;}
  if(act==='scan-loan'){
    var a=byId('anggota',S.scan.anggotaId),b=byId('buku',S.scan.bukuId);if(!a||!b)return;
    if(activeLoan(b.id)){toast('Buku ini sedang dipinjam.','err');return;}
    var t=today();
    if(put('pinjaman',uid('p'),{anggotaId:a.id,bukuId:b.id,tglPinjam:t,tenggat:addDays(t,LOAN_DAYS),tglKembali:null},'pinjam')){toast(b.judul+' dipinjamkan ke '+a.nama+'. Tenggat '+fmt(addDays(t,LOAN_DAYS))+'.');S.scan.bukuId=null;refreshScan();focusScan();}
    return;
  }
  if(act==='return'){
    var p=byId('pinjaman',el.dataset.id);if(!p)return;
    if(patch('pinjaman',p.id,{tglKembali:today()},'kembali')){toast('Buku dikembalikan.');if(S.scan.bukuId===p.bukuId)S.scan.bukuId=null;refreshScan();focusScan();}
    return;
  }
  if(act==='del'){
    var c=el.dataset.c,id=el.dataset.id;
    if(el.dataset.armed){
      var why=DEPS[c](id);if(why){toast(why,'err');render();return;}
      var gone=c==='admin'?(byId('admin',id)||{}).nama:null;
      if(drop(c,id)){toast('Data dihapus.');if(gone&&gone===S.petugas){setPetugas(null);render();openPetugas();}}
      return;
    }
    el.dataset.armed='1';el.classList.add('armed');var old=el.innerHTML;el.innerHTML='Hapus?';
    setTimeout(function(){if(document.contains(el)){delete el.dataset.armed;el.classList.remove('armed');el.innerHTML=old;}},3000);
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='scan-form'){e.preventDefault();var i=$('#scan-in');handleScan(i.value);i.value='';focusScan();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id&&t.id.indexOf('q-')===0){S.q[t.id.slice(2)]=t.value;render();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-anggotaKelas'&&!t.closest('#m-form')){S.f.anggotaKelas=t.value;render();}
  if(t.id==='f-riwayat'&&!t.closest('#m-form')){S.f.riwayat=t.value;render();}
  if(t.id==='lap-dari'){S.lap.dari=t.value;render();}
  if(t.id==='lap-sampai'){S.lap.sampai=t.value;render();}
  if(t.id==='restore-file'){readBackup(t.files&&t.files[0]);t.value='';}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();$('#side').classList.remove('open');}
  if(e.key==='Tab'){
    var m=$('.modal');if(!m)return;
    var f=Array.prototype.filter.call(m.querySelectorAll('button,input,select'),function(x){return !x.disabled&&x.offsetParent!==null;});
    if(!f.length)return;var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
  }
});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(VIEWS[v]&&v!==S.view)go(v);});
try{var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',function(){render();});}catch(e){}

/* ---------- boot ---------- */
function boot(){
  try{var tema=localStorage.getItem('pustaka-tema');if(tema==='dark'||tema==='light')document.documentElement.setAttribute('data-theme',tema);}catch(e){}
  load();
  S.lap.sampai=today();
  var h=location.hash.slice(1);if(VIEWS[h])S.view=h;
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if(!S.petugas)openPetugas();
}
boot();
})();
</script>
</body>
</html>
