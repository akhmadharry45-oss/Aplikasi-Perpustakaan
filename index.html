<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12361F">
<title>Perpustakaan SD Negeri 1 Barabai Timur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: deep-green fixed sidebar, sticky top bar, one content column; wide tables scroll inside their own panel. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#EAEFE7; --line:#D9E1D6;
  --fg:#16261B; --muted:#5A6B5E;
  --primary:#1E6B3C; --on-primary:#FFFFFF; --primary-soft:#DDEDE0; --primary-ink:#17512D;
  --accent:#E5A11A; --accent-soft:#FBEFCD; --accent-ink:#6A4700;
  --danger:#B63A27; --danger-soft:#F8DFD9; --danger-ink:#8E2A1A;
  --info:#2B6E98; --info-soft:#DCEBF4; --info-ink:#1E5273;
  --side-bg:#12361F; --side-fg:#CFE2D3; --side-muted:#8FB09A; --side-hover:rgba(255,255,255,.07); --side-active:rgba(255,255,255,.13);
  --scrim:rgba(12,24,16,.55); --shadow:0 12px 40px rgba(10,30,18,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1712; --surface:#17231B; --surface-2:#1F2F25; --line:#2C3F32;
    --fg:#E6EEE7; --muted:#9CAFA0;
    --primary:#52B476; --on-primary:#07170D; --primary-soft:#1F3B2A; --primary-ink:#8FD7A9;
    --accent:#F0B43C; --accent-soft:#3A2E10; --accent-ink:#F3CF7A;
    --danger:#F08A78; --danger-soft:#3E1D17; --danger-ink:#F4A798;
    --info:#7FB8DB; --info-soft:#16303F; --info-ink:#A8D2EA;
    --side-bg:#0B1A11; --side-fg:#C9DDCD; --side-muted:#7E9C88;
    --scrim:rgba(0,0,0,.65); --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17231B; --surface-2:#1F2F25; --line:#2C3F32;
  --fg:#E6EEE7; --muted:#9CAFA0;
  --primary:#52B476; --on-primary:#07170D; --primary-soft:#1F3B2A; --primary-ink:#8FD7A9;
  --accent:#F0B43C; --accent-soft:#3A2E10; --accent-ink:#F3CF7A;
  --danger:#F08A78; --danger-soft:#3E1D17; --danger-ink:#F4A798;
  --info:#7FB8DB; --info-soft:#16303F; --info-ink:#A8D2EA;
  --side-bg:#0B1A11; --side-fg:#C9DDCD; --side-muted:#7E9C88;
  --scrim:rgba(0,0,0,.65); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3,p{margin:0}
h2,h3{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;padding:20px 12px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));z-index:20;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#2A1C00;display:grid;place-items:center}
.brand-mark .i{width:22px;height:22px}
.brand b{display:block;font-family:var(--font-display);font-size:19px;letter-spacing:.06em;color:#fff;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--side-muted);line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--side-fg);font-weight:500;text-align:left;cursor:pointer}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav button[aria-current="page"] .i{color:var(--accent)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:var(--side-muted);line-height:1.4}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumb{color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:600}
.grow{flex:1}
.menu-btn{display:none}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.sync.warn i{background:var(--accent)}
.sync.off i{background:var(--danger)}
.content{width:100%;max-width:1240px;margin-inline:auto;padding-block:24px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;flex:1}
.foot{padding:16px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.ib{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;gap:6px}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.ib.del:hover,.ib.armed{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger)}
.ib.ok{color:var(--primary-ink);background:var(--primary-soft);border-color:transparent}
.ib.wide{display:inline-flex;align-items:center}
.ops{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.search{position:relative;display:flex;align-items:center;min-width:0;flex:1 1 240px;max-width:380px}
.search .i{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search input{padding-left:36px}
input,select{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0}
input::placeholder{color:var(--muted);opacity:.8}
select{appearance:auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600}
.req{color:var(--danger)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink)}

/* page blocks */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.ph h2{font-size:26px;font-weight:700;line-height:1.15}
.sub{color:var(--muted);margin-top:4px;max-width:62ch}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 18px 0}
.panel-h h3{font-size:16px;font-weight:700}
.panel-b{padding:16px 18px 18px}
.toolbar{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;padding:14px 18px 0}
.tablewrap{overflow-x:auto;padding:10px 6px 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.t{min-width:200px}
th.r,td.r{text-align:right}
.empty{padding:34px 18px;text-align:center;color:var(--muted);max-width:52ch;margin-inline:auto}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:16px;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--primary-soft);color:var(--primary-ink)}
.chip.warn{background:var(--accent-soft);color:var(--accent-ink)}
.chip.bad{background:var(--danger-soft);color:var(--danger-ink)}
.chip.info{background:var(--info-soft);color:var(--info-ink)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.bc{display:inline-block;background:#fff;padding:3px 6px;border-radius:4px;line-height:0;border:1px solid var(--line)}
.bc svg{height:26px;width:auto;max-width:110px}
.notice{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:12px 16px;font-size:13px}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{display:flex;gap:14px;align-items:center;padding:18px;border-radius:12px;border:1px solid transparent}
.tile-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);flex:none}
.tile-ico .i{width:22px;height:22px}
.tile-k{font-size:12.5px;font-weight:600}
.tile-v{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile-s{font-size:12px;opacity:.85}
.t-green{background:var(--primary-soft);color:var(--primary-ink)}
.t-blue{background:var(--info-soft);color:var(--info-ink)}
.t-amber{background:var(--accent-soft);color:var(--accent-ink)}
.t-red{background:var(--danger-soft);color:var(--danger-ink)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.chartbox{position:relative;height:250px}
.msg{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center}
.bars{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:90px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bars .tr{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--primary);border-radius:6px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;min-height:0}
.modal.wide{max-width:600px}
.modal form{display:flex;flex-direction:column;min-height:0}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.form-err{color:var(--danger-ink);background:var(--danger-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--danger);color:#fff}

/* member card (kept light, like a printed card, in both themes) */
.idcard{background:#fff;color:#1B2A1F;border-radius:10px;overflow:hidden;border:1px solid var(--line);width:100%;max-width:520px;margin-inline:auto}
.idcard-h{background:#1E6B3C;color:#fff;display:flex;gap:14px;align-items:center;padding:14px 16px}
.idcard-h svg{width:54px;height:54px;flex:none}
.idcard-h small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.idcard-h b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.15;letter-spacing:.01em}
.idcard-h span{display:block;font-size:10.5px;opacity:.85;margin-top:3px;line-height:1.3}
.idcard-b{padding:16px 18px 6px;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;font-size:13.5px}
.idcard-b dt{color:#3D5043}
.idcard-b dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.idcard-f{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;padding:12px 18px 16px;background:linear-gradient(#fff,#CFE4D3);font-size:13px}
.qrbox{background:#fff;padding:7px;border-radius:6px;line-height:0;width:118px;height:118px}
.qrbox img,.qrbox canvas{max-width:100%;height:auto}
.sign{text-align:left;min-width:0}
.sign p{color:#3D5043}
.sign b{display:block;margin-top:34px;font-size:13.5px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(280px,86vw);padding-top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-grid}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .ph h2{font-size:22px}
}
@media (max-width:520px){
  .row2{grid-template-columns:minmax(0,1fr)}
  .tile{padding:14px}
  .tile-v{font-size:28px}
  .sync span{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.ib.menu-btn{display:none}
.scan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.scan-act{grid-column:1/-1}
.scan-row{display:flex;gap:8px}
.scan-cam{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
#reader{width:100%;max-width:440px;margin-top:14px;border-radius:10px;overflow:hidden}
.scan-name{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.25}
.loanlist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.loanlist li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.petugas span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.notice b{font-weight:700}
.notice .btn{margin-left:6px}
.idcard{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media (max-width:900px){.scan-grid{grid-template-columns:minmax(0,1fr)}.ib.menu-btn{display:inline-grid}}
@media (max-width:520px){.petugas span{max-width:70px}}
@media print{
  body{background:#fff}
  body::before{display:none}
  .side,.top,.foot,.ph-a,.toolbar,.ops,#toast-root,.menu-btn{display:none!important}
  .app{display:block}
  body:has(.modal) .app{display:none!important}
  .scrim{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;border:0;max-width:none}
  .modal-h,.modal-f{display:none}
  .panel{break-inside:avoid}
  .content{padding:0}
}

input[type=radio]{width:auto;padding:0;margin:0;accent-color:var(--primary)}
.radios{display:flex;gap:6px 20px;flex-wrap:wrap}
.radio{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;cursor:pointer}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;border:2px dashed var(--line);border-radius:12px;text-align:center;cursor:pointer;color:var(--muted);background:var(--surface)}
.drop b{color:var(--fg);font-family:var(--font-display);font-size:16px}
.drop .i{width:28px;height:28px}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink)}
.imp-list{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--danger-ink)}
.imp-list li{margin:2px 0}
code.mono{background:var(--surface-2);padding:1px 6px;border-radius:5px}
.notice .btn+.btn{margin-left:6px}
@media print{.drop{display:none}}

.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 20px}
.foot .credit{text-transform:none;letter-spacing:.02em;font-weight:600;color:var(--fg);font-size:12.5px}
.login{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login-card h2{font-size:24px;letter-spacing:.04em}
.brand-mark.lg{width:48px;height:48px;border-radius:12px}
.login-credit{margin:4px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);text-align:center}
@media print{.login{display:none}}

/* ===== 3D layer: depth tokens, tilt, pressable buttons, CSS-3D books ===== */
:root{
  --d1:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(10,30,18,.10),0 4px 10px rgba(10,30,18,.08);
  --d2:0 1px 0 rgba(255,255,255,.7) inset,0 2px 4px rgba(10,30,18,.10),0 10px 24px rgba(10,30,18,.14),0 24px 48px rgba(10,30,18,.08);
  --d3:0 2px 4px rgba(10,30,18,.14),0 18px 36px rgba(10,30,18,.22),0 40px 80px rgba(10,30,18,.18);
  --glow:rgba(229,161,26,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --d1:0 1px 0 rgba(255,255,255,.06) inset,0 2px 4px rgba(0,0,0,.4),0 6px 14px rgba(0,0,0,.3);
  --d2:0 1px 0 rgba(255,255,255,.07) inset,0 4px 8px rgba(0,0,0,.45),0 16px 32px rgba(0,0,0,.45),0 30px 60px rgba(0,0,0,.35);
  --d3:0 4px 8px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.55),0 48px 90px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --d1:0 1px 0 rgba(255,255,255,.06) inset,0 2px 4px rgba(0,0,0,.4),0 6px 14px rgba(0,0,0,.3);
  --d2:0 1px 0 rgba(255,255,255,.07) inset,0 4px 8px rgba(0,0,0,.45),0 16px 32px rgba(0,0,0,.45),0 30px 60px rgba(0,0,0,.35);
  --d3:0 4px 8px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.55),0 48px 90px rgba(0,0,0,.45);
}
body{background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 70%),radial-gradient(700px 420px at 0% 100%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.content{perspective:1400px}
[data-tilt]{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s ease-out,box-shadow .25s ease;transform-style:preserve-3d;will-change:transform}
[data-tilt]:not(:hover){transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .4s ease}

/* shell depth */
.side{background:linear-gradient(170deg,color-mix(in srgb,var(--side-bg) 82%,#fff 18%),var(--side-bg) 38%,color-mix(in srgb,var(--side-bg) 85%,#000 15%));box-shadow:8px 0 30px rgba(0,0,0,.28),inset -1px 0 0 rgba(255,255,255,.06)}
.brand-mark{background:linear-gradient(145deg,#F7C65A,var(--accent) 55%,#C98400);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 -3px 0 rgba(0,0,0,.18) inset,0 8px 16px rgba(0,0,0,.4);transform:perspective(300px) rotateY(-14deg) rotateX(6deg);transition:transform .4s}
.brand:hover .brand-mark{transform:perspective(300px) rotateY(14deg) rotateX(-4deg) scale(1.06)}
.nav button{transition:transform .18s,background .18s,box-shadow .18s}
.nav button:hover{transform:translateX(4px) translateZ(0)}
.nav button[aria-current="page"]{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 14px rgba(0,0,0,.35);transform:translateX(5px)}
.top{box-shadow:0 8px 24px rgba(10,30,18,.10);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%)}
.foot{box-shadow:0 -8px 24px rgba(10,30,18,.06)}

/* surfaces */
.panel{box-shadow:var(--d2);border-color:color-mix(in srgb,var(--line) 70%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 100%,#fff 0%),var(--surface))}
.panel{transition:transform .25s,box-shadow .25s}
.panel:hover{transform:translateY(-3px);box-shadow:var(--d3)}
.tile{position:relative;box-shadow:var(--d2);overflow:visible;border:1px solid rgba(255,255,255,.35);background-image:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(220px circle at var(--mx) var(--my),rgba(255,255,255,.45),transparent 60%);opacity:0;transition:opacity .3s}
.tile:hover::after{opacity:1}
.tile:hover{box-shadow:var(--d3)}
.tile-ico{transform:translateZ(36px);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 -3px 0 rgba(0,0,0,.08) inset,0 10px 18px rgba(10,30,18,.22);background:linear-gradient(145deg,#fff,var(--surface-2))}
.tile-tx{transform:translateZ(22px)}
.tile-v{text-shadow:0 2px 0 rgba(255,255,255,.4),0 6px 12px rgba(0,0,0,.12)}
.tile{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.tile:nth-child(2){animation-delay:.07s}.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.21s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile{border-color:rgba(255,255,255,.08);background-image:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,0) 55%)}:root:not([data-theme="light"]) .tile-ico{background:linear-gradient(145deg,var(--surface-2),var(--surface))}}
:root[data-theme="dark"] .tile{border-color:rgba(255,255,255,.08);background-image:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,0) 55%)}
:root[data-theme="dark"] .tile-ico{background:linear-gradient(145deg,var(--surface-2),var(--surface))}

/* view entrance */
.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:perspective(900px) translateY(26px) rotateX(10deg)}to{opacity:1;transform:none}}

/* pressable 3D buttons */
.btn{position:relative;transition:transform .12s,box-shadow .12s,filter .15s;transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 82%,#fff 18%),var(--primary));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 color-mix(in srgb,var(--primary) 55%,#000 45%),0 8px 16px rgba(10,30,18,.28)}
.btn.ghost{box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 3px 0 var(--line),0 6px 12px rgba(10,30,18,.10)}
.btn.amber{background:linear-gradient(180deg,#F7C65A,var(--accent));color:#2A1C00;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 4px 0 #A56E00,0 8px 16px rgba(10,30,18,.28)}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 0 rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2),0 2px 4px rgba(10,30,18,.2)}
.btn.sm{margin-bottom:3px}
.ib{box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 0 var(--line),0 4px 8px rgba(10,30,18,.08);transition:transform .12s,box-shadow .12s,background .15s}
.ib:hover{transform:translateY(-1px)}.ib:active{transform:translateY(2px);box-shadow:none}
.seg{box-shadow:inset 0 2px 4px rgba(10,30,18,.12)}
.seg button[aria-pressed="true"]{box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 3px 6px rgba(10,30,18,.18);transform:translateY(-1px)}
input,select{box-shadow:inset 0 2px 4px rgba(10,30,18,.08);transition:box-shadow .2s,border-color .2s}
input:focus,select:focus{box-shadow:inset 0 2px 4px rgba(10,30,18,.08),0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent);border-color:var(--primary);outline:0}
.chip{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 4px rgba(10,30,18,.12)}
tbody tr{transition:transform .15s}
tbody tr:hover{transform:translateZ(0) scale(1.003)}
tbody tr:hover td{box-shadow:0 8px 14px -10px rgba(10,30,18,.4)}
.notice{box-shadow:var(--d1)}
.drop{box-shadow:inset 0 2px 8px rgba(10,30,18,.08);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.drop:hover{transform:translateY(-3px);box-shadow:var(--d2)}
.loanlist li{box-shadow:var(--d1)}

/* modal + toast + login */
.scrim{perspective:1200px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{box-shadow:var(--d3);animation:pop .4s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:50% 100%}
@keyframes pop{from{opacity:0;transform:rotateX(-18deg) translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.toast{box-shadow:var(--d3);animation:toastin .4s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(24px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
.login{background:radial-gradient(800px 500px at 20% 10%,color-mix(in srgb,var(--primary) 26%,transparent),transparent 70%),radial-gradient(700px 500px at 90% 90%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--bg);perspective:1200px}
.login-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:400px}
.login-stage{height:170px;width:100%;display:grid;place-items:center;perspective:900px}
.login-stage .book{--s:.9}
.login-card{box-shadow:var(--d3);animation:pop .6s cubic-bezier(.2,.9,.25,1.1) both}

/* member card */
.idcard{box-shadow:var(--d3);position:relative;transform-style:preserve-3d}
.idcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);background-size:250% 100%;background-position:calc(var(--mx,50%)*-1 + 120%) 0;mix-blend-mode:soft-light}
.qrbox{box-shadow:0 8px 16px rgba(10,30,18,.25);transform:translateZ(24px)}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:10px;padding:28px 30px;border-radius:20px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#1E6B3C,#0F3D22 60%,#0A2A17);box-shadow:var(--d3);border:1px solid rgba(255,255,255,.12);min-height:260px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px 300px at 85% 20%,rgba(229,161,26,.35),transparent 65%),radial-gradient(400px 300px at 0% 100%,rgba(82,180,118,.3),transparent 70%);animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(3%,-3%,0) scale(1.08)}}
.hero-copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#F3CF7A;font-weight:700}
.hero h2{font-size:clamp(24px,3.4vw,38px);line-height:1.1;text-shadow:0 4px 14px rgba(0,0,0,.35)}
.hero p{color:#D6E9DA;max-width:46ch}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hero-stats div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 14px;font-size:12px;color:#CFE2D3;box-shadow:0 8px 16px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.2) inset;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero-stats b{display:block;font-family:var(--font-display);font-size:26px;color:#fff;line-height:1.1}
.hero .actions{margin-top:4px}
.stage{position:relative;height:240px;perspective:1000px;display:grid;place-items:center;z-index:1}
.stage .book{position:absolute}
.stage .b1{--s:1;transform:translate3d(-8%,6px,0)}
.stage .b2{--s:.82;transform:translate3d(38%,56px,0)}
.stage .b3{--s:.7;transform:translate3d(-48%,70px,0)}

/* CSS-3D book */
.book{--w:120px;--h:164px;--t:32px;width:var(--w);height:var(--h);transform-style:preserve-3d;scale:var(--s,1)}
.bk{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(-32deg);animation:spin 9s ease-in-out infinite alternate;transform-origin:50% 50%}
.b2 .bk{animation-delay:-3s;animation-duration:11s}.b3 .bk{animation-delay:-6s;animation-duration:13s}
@keyframes spin{from{transform:rotateX(-14deg) rotateY(-40deg) translateY(0)}50%{transform:rotateX(-8deg) rotateY(-8deg) translateY(-10px)}to{transform:rotateX(-16deg) rotateY(26deg) translateY(0)}}
.f{position:absolute;display:block;backface-visibility:hidden}
.f.front{inset:0;transform:translateZ(calc(var(--t)/2));border-radius:3px 8px 8px 3px;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 40%),var(--cv,#1E6B3C);box-shadow:inset 6px 0 8px -4px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.f.front b{font-family:var(--font-display);font-size:13px;letter-spacing:.2em;color:#F7C65A;writing-mode:vertical-rl;text-shadow:0 2px 3px rgba(0,0,0,.4);border:1.5px solid rgba(247,198,90,.7);padding:12px 6px;border-radius:4px}
.f.back{inset:0;transform:translateZ(calc(var(--t)/-2)) rotateY(180deg);background:var(--cv,#1E6B3C);filter:brightness(.7);border-radius:8px 3px 3px 8px}
.f.spine{top:0;left:0;width:var(--t);height:100%;transform:translateX(calc(var(--t)/-2)) rotateY(-90deg);background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 50%,rgba(0,0,0,.2)),var(--cv,#1E6B3C);filter:brightness(.82)}
.f.pages{top:3px;right:0;width:var(--t);height:calc(100% - 6px);transform:translateX(calc(var(--t)/2 - 2px)) rotateY(90deg);background:repeating-linear-gradient(0deg,#fff 0 2px,#E6DFC9 2px 3px)}
.f.top{left:3px;top:0;width:calc(100% - 3px);height:var(--t);transform:translateY(calc(var(--t)/-2)) rotateX(90deg);background:repeating-linear-gradient(90deg,#fff 0 2px,#E6DFC9 2px 3px)}
.f.bot{left:3px;bottom:0;width:calc(100% - 3px);height:var(--t);transform:translateY(calc(var(--t)/2)) rotateX(-90deg);background:#0A2A17}
.b1{--cv:#1E6B3C}.b2{--cv:#C98400}.b3{--cv:#2B6E98}
.book::after{content:"";position:absolute;left:50%;bottom:-34px;width:150px;height:26px;margin-left:-75px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);filter:blur(4px);transform:translateZ(-60px) rotateX(90deg) translateZ(0);opacity:.0}

/* charts */
.chartbox{perspective:800px}
.chartbox canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 14px 14px rgba(10,30,18,.18))}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg i{width:12px;height:12px;border-radius:4px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 4px rgba(0,0,0,.3)}
.lg b{color:var(--fg)}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);padding:22px 20px}
  .stage{height:190px}
  .stage .b1{transform:translate3d(0,0,0) scale(.85)}
  .tile{animation:none}
}
@media (max-width:520px){.hero-stats b{font-size:22px}.stage{height:160px}.stage .book{scale:calc(var(--s,1)*.8)}}
@media (prefers-reduced-motion:reduce){
  [data-tilt],.tile,.hero,.hero-bg,.enter>*,.modal,.toast,.login-card,.bk,.panel,.btn,.ib{animation:none!important;transition:none!important}
  .bk{transform:rotateX(-14deg) rotateY(-28deg)}
  .toast{transform:translateX(-50%)}
}
@media print{
  .hero,.stage,.hero-bg{display:none!important}
  *{box-shadow:none!important;animation:none!important;transform:none!important;backdrop-filter:none!important}
  .idcard{box-shadow:none!important}
}

.bcbox{background:#fff;border-radius:8px;line-height:0;width:min(100%,260px);padding:4px;box-shadow:0 8px 16px rgba(10,30,18,.25);transform:translateZ(24px);flex:none}.bcbox canvas{width:100%;height:auto;display:block}

.bc.qr{padding:4px;line-height:0;border-radius:6px}.qrc{display:inline-block;width:64px;height:64px;line-height:0}.qrc img,.qrc canvas{width:64px!important;height:64px!important;display:block}

#print-cards{display:none}
@media print{
  body.pc .app,body.pc #modal-root,body.pc #toast-root{display:none!important}
  body.pc{background:#fff!important}
  body.pc #print-cards{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6mm;padding:0}
  body.pc #print-cards .idcard{break-inside:avoid;max-width:none;box-shadow:none!important;border:1px solid #bbb}
  body.pc #print-cards .idcard-h{padding:7px 10px;gap:8px}
  body.pc #print-cards .idcard-h svg{width:30px;height:30px}
  body.pc #print-cards .idcard-h small{font-size:7px}
  body.pc #print-cards .idcard-h b{font-size:11px}
  body.pc #print-cards .idcard-h span{font-size:6.5px}
  body.pc #print-cards .idcard-b{padding:7px 10px 2px;font-size:8.5px;gap:1px 8px}
  body.pc #print-cards .idcard-f{padding:5px 10px 8px;font-size:8px}
  body.pc #print-cards .qrbox{width:72px;height:72px;padding:4px}
  body.pc #print-cards .qrbox canvas,body.pc #print-cards .qrbox img{width:64px!important;height:64px!important}
  body.pc #print-cards .sign b{margin-top:14px;font-size:8.5px}
  @page{margin:10mm}
}

.rankgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rank li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center}
.rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;background:var(--surface-2);color:var(--muted);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 3px 6px rgba(10,30,18,.2)}
.rank li:first-child .rk{background:linear-gradient(145deg,#F7C65A,#C98400);color:#2A1C00}
.rk-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.rk-tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-tx small{color:var(--muted);font-size:12px}
.rk-tx .tr{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:3px;box-shadow:inset 0 1px 2px rgba(10,30,18,.2)}
.rk-tx .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 70%,#fff))}
.rk-p .tr i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff))}
.rk-n{font-family:var(--font-display);font-size:22px;text-align:right}
.rk-n small{font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:500}
@media (max-width:900px){.rankgrid{grid-template-columns:minmax(0,1fr)}}
@media print{.rankgrid{grid-template-columns:repeat(2,1fr)}}
</style>

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
function fmt(s){if(!s)return '–';var p=s.split('-');return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0];}
function fmtDT(t){var d=new Date(t);if(isNaN(d))return '–';return fmt(iso(d))+', '+pad(d.getHours())+'.'+pad(d.getMinutes());}
function dmy(s){return s?s.split('-').reverse().join('-'):'';}

function effTheme(){var t=document.documentElement.getAttribute('data-theme');if(t)return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}

function ecode(e){return String(e&&e.code||'').replace(/^[a-z]+\//,'').replace(/-/g,'_');}
function dbMsg(e){
  var c=ecode(e);
  if(c==='permission_denied')return 'Akun ini tidak punya izin menyimpan data. Periksa aturan Firestore di Firebase Console.';
  if(c==='quota_exceeded')return 'Penyimpanan penuh. Hapus data yang tidak dipakai lalu coba lagi.';
  if(c==='invalid_argument')return 'Akun ini hanya bisa melihat data, tidak bisa mengubahnya.';
  if(c==='resource_exhausted')return 'Terlalu banyak permintaan sekaligus. Tunggu sebentar lalu coba lagi.';
  if(c==='revoked')return 'Akses ke data dicabut. Muat ulang halaman.';
  return 'Data belum tersimpan. Periksa koneksi internet lalu coba lagi.';
}
async function saveFile(name,data,mime){
  if(S.dl){
    try{await S.dl.save({filename:name,data:data});return true;}
    catch(e){if(!e||e.code!=='declined')toast('Berkas tidak bisa diunduh di tampilan ini.','err');return false;}
  }
  var blob=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  return true;
}
async function hashPin(pin){
  var text=SALT+':'+pin;
  try{
    var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return pad(b.toString(16));}).join('');
  }catch(e){var h=5381;for(var i=0;i<text.length;i++)h=((h<<5)+h+text.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);}
}

function loadLocal(){

    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);COLS.forEach(function(c){S[c]=Array.isArray(d[c])?d[c]:[];});S.setting=d.setting||null;S.log=Array.isArray(d.log)?d.log:[];S.lastBackup=d.lastBackup||null;}

}
function persist(){
  try{
    var o={versi:1,setting:S.setting,log:S.log,lastBackup:S.lastBackup};
    COLS.forEach(function(c){o[c]=S[c];});
    localStorage.setItem(KEY,JSON.stringify(o));S.storeOk=true;return true;
  }catch(e){S.storeOk=false;toast('Data tidak bisa disimpan di peramban ini. Unduh cadangan sekarang.','err');return false;}
}

  }
  return c;
}
function guard(){

  if(S.petugas)return true;

function applyLocal(op){
  if(op.c==='pengaturan'){S.setting=op.data;return;}
  var arr=S[op.c],i=arr.findIndex(function(x){return x.id===op.id;});
  if(op.data===null){if(i>=0)arr.splice(i,1);return;}
  var row=Object.assign({id:op.id},op.data);
  if(i>=0)arr[i]=row;else arr.push(row);
}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej({code:'unavailable'});},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
async function withRetry(fn){
  for(var t=0;;t++){
    try{return await withTimeout(Promise.resolve(fn()),25000);}
    catch(e){
      var c=ecode(e);
      if(['resource_exhausted','unavailable','deadline_exceeded','aborted'].indexOf(c)>=0&&t<5){await sleep(400*Math.pow(2,t)+Math.random()*200);continue;}
      throw e;
    }
  }
}
async function runOnline(ops,progress){
  var i=0,done=0,failed=null,N=ops.length;
  async function one(op){
    var ref=op.c==='pengaturan'?S.db.doc('pengaturan/sekolah'):S.db.collection(op.c).doc(op.id);
    try{await withRetry(function(){return op.data===null?ref.delete():ref.set(op.data);});return true;}
    catch(e){failed=e;return false;}
  }
  var workers=[],n=Math.min(4,N);
  for(var k=0;k<n;k++){
    workers.push((async function(){
      while(!failed){
        var idx=i++;if(idx>=N)return;
        if(await one(ops[idx])){done++;if(progress)progress(done,N);}
      }
    })());
  }
  await Promise.all(workers);
  if(failed){toast(dbMsg(failed),'err');return false;}
  return true;
}
async function writeLog(entries){
  var base=Date.now();
  var rows=entries.map(function(e,i){return {t:new Date(base+i).toISOString(),p:S.petugas||'-',a:e.a,r:e.r};});
  if(S.db){
    for(var i=0;i<rows.length;i++){var ref=S.db.collection('log').doc(uid('l')),row=rows[i];try{await withRetry(function(){return ref.set(row);});}catch(e){}}
  }else{
    rows.slice().reverse().forEach(function(r){S.log.unshift(r);});
    if(S.log.length>1000)S.log.length=1000;
    persist();
  }
}
async function commit(ops,o){
  o=o||{};
  if(!o.noGuard&&!guard())return false;
  var logs=o.logs;
  if(!logs){
    logs=ops.map(function(op){
      var ex=op.c==='pengaturan'?S.setting:byId(op.c,op.id);
      if(op.data===null)return {a:'hapus',r:ex?describe(op.c,ex):op.c};
      return {a:o.aksi||(ex?'ubah':'tambah'),r:describe(op.c,op.data)};
    });
    if(o.logAs&&logs.length)logs=logs.map(function(l){return {a:o.logAs,r:l.r};});
  }
  if(S.db){
    if(!(await runOnline(ops,o.progress)))return false;
  }else{
    ops.forEach(applyLocal);
    if(!persist())return false;
  }
  await writeLog(logs);
  scheduleRender();
  return true;
}
function put(c,id,data,aksi){return commit([{c:c,id:id,data:data}],{aksi:aksi});}
function drop(c,id){return commit([{c:c,id:id,data:null}]);}
function patch(c,id,part,aksi){var cur=byId(c,id);if(!cur)return Promise.resolve(false);return put(c,id,Object.assign(strip(cur),part),aksi);}

function subscribeAll(){
  var waiting=COLS.length+2,seen={};
  function first(k){if(seen[k])return;seen[k]=1;if(--waiting===0){S.ready=true;onReady();}}
  COLS.forEach(function(c){
    S.db.collection(c).onSnapshot(function(snap){
      S[c]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      if(S.auth&&c==='admin')S.petugas=petugasName();
      first(c);scheduleRender();
    },function(e){S.dbState='error';S.dbErr=ecode(e);first(c);scheduleRender();});
  });
  S.db.doc('pengaturan/sekolah').onSnapshot(function(s){S.setting=s.exists?s.data():null;first('pengaturan');scheduleRender();},function(){first('pengaturan');});
  S.db.collection('log').orderBy('t','desc').limit(300).onSnapshot(function(snap){
    S.log=snap.docs.map(function(d){return d.data();});first('log');scheduleRender();
  },function(){first('log');});
}

function normHead(h){return String(h==null?'':h).toLowerCase().replace(/[^a-z0-9]/g,'');}
function nonEmpty(c){return String(c==null?'':c).trim()!=='';}
function cellStr(v){
  if(v==null)return '';
  if(v instanceof Date){if(isNaN(v))return '';var d=new Date(v.getTime()+12*36e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
  if(typeof v==='number')return Number.isFinite(v)?String(v):'';
  return String(v).trim();
}
function chkDate(y,m,d){
  if(y<1900||y>2100||m<1||m>12||d<1||d>31)return null;
  var t=new Date(Date.UTC(y,m-1,d));if(t.getUTCMonth()!==m-1)return null;
  return y+'-'+pad(m)+'-'+pad(d);
}
function parseDate(s){
  s=String(s||'').trim();if(!s)return '';
  var m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/)))return chkDate(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/)))return chkDate(+m[3],+m[2],+m[1]);
  if(/^\d{5}$/.test(s)){var d=new Date(Date.UTC(1899,11,30)+(+s)*864e5);return chkDate(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}
  return null;
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  var first=text.split(/\r?\n/,1)[0]||'';
  var delim=[',',';','\t'].map(function(d){return [d,first.split(d).length];}).sort(function(a,b){return b[1]-a[1];})[0][0];
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
async function readMatrix(file){
  var name=file.name.toLowerCase();
  if(/\.(xlsx|xls|xlsm)$/.test(name)){
    if(typeof XLSX==='undefined')throw new Error('Pembaca Excel gagal dimuat. Periksa koneksi internet, atau simpan berkas sebagai CSV.');
    var buf=await file.arrayBuffer();
    var wb=XLSX.read(buf,{type:'array',cellDates:true});
    if(!wb.SheetNames.length)throw new Error('Berkas Excel tidak berisi lembar kerja.');
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  }
  if(/\.(csv|txt|tsv)$/.test(name))return parseCSV(await file.text());
  throw new Error('Format berkas tidak didukung. Pakai .xlsx, .xls, atau .csv.');
}

function buildPlan(tipe,matrix){
  var spec=SPEC[tipe],hi=-1;
  for(var i=0;i<matrix.length;i++){if(matrix[i].some(nonEmpty)){hi=i;break;}}
  if(hi<0)throw new Error('Berkas kosong.');
  var heads=matrix[hi].map(normHead),idx={};
  spec.cols.forEach(function(c){idx[c.k]=-1;for(var j=0;j<heads.length;j++){if(c.h.indexOf(heads[j])>=0){idx[c.k]=j;break;}}});
  var miss=spec.cols.filter(function(c){return c.req&&idx[c.k]<0;}).map(function(c){return c.t;});
  if(miss.length)throw new Error('Kolom wajib tidak ditemukan: '+miss.join(', ')+'. Unduh template untuk melihat susunan kolomnya.');
  var rows=matrix.slice(hi+1).filter(function(r){return r.some(nonEmpty);});
  if(rows.length>MAX_IMPORT)throw new Error('Berkas berisi '+rows.length+' baris. Maksimal '+MAX_IMPORT+' baris per berkas, pecah menjadi beberapa berkas.');
  if(!rows.length)throw new Error('Berkas hanya berisi judul kolom, belum ada data.');
  var ctx=makeCtx(),plan={tipe:tipe,items:[],jumlah:{baru:0,ada:0,salah:0},ctx:ctx};
  matrix.slice(hi+1).forEach(function(row,n){
    if(!row.some(nonEmpty))return;
    var rec={};spec.cols.forEach(function(c){rec[c.k]=idx[c.k]>=0?cellStr(row[idx[c.k]]):'';});
    var it={line:hi+2+n};
    try{spec.make(rec,ctx,it);}catch(e){it.status='salah';it.err=e.message;}
    plan.items.push(it);plan.jumlah[it.status]++;
  });
  return plan;
}
function planOps(plan,mode){
  var ops=[],need={},items=plan.items.filter(function(it){return it.status==='baru'||(it.status==='ada'&&mode==='perbarui'&&plan.tipe!=='pinjaman');});
  items.forEach(function(it){(it.refs||[]).forEach(function(id){need[id]=1;});});
  Object.keys(plan.ctx.newKelas).forEach(function(id){if(need[id])ops.push({c:'kelas',id:id,data:{nama:plan.ctx.newKelas[id],wali:''}});});
  Object.keys(plan.ctx.newKategori).forEach(function(id){if(need[id])ops.push({c:'kategori',id:id,data:{nama:plan.ctx.newKategori[id]}});});
  items.forEach(function(it){ops.push({c:it.c,id:it.id,data:it.data});});
  return {ops:ops,baru:items.filter(function(i){return i.status==='baru';}).length,ubah:items.filter(function(i){return i.status==='ada';}).length};
}

async function impGo(){
  if(!IMP.plan||IMP.busy)return;
  var pl=planOps(IMP.plan,IMP.mode);if(!pl.ops.length)return;
  if(!guard())return;
  IMP.busy=true;IMP.progress='Mengimpor…';render();
  var label=SPEC[IMP.plan.tipe].label,parts=[];
  if(pl.baru)parts.push(pl.baru+' baru');if(pl.ubah)parts.push(pl.ubah+' diperbarui');
  var ok=await commit(pl.ops,{logs:[{a:'impor',r:'Impor '+label+': '+parts.join(', ')+' dari '+IMP.fileName}],progress:function(x,n){IMP.progress='Mengimpor '+x+' dari '+n+'…';var b=$('#imp-go');if(b)b.innerHTML=icon('upload')+' '+esc(IMP.progress);}});
  IMP.busy=false;
  if(ok){var t=IMP.plan.tipe;IMP.plan=null;IMP.fileName='';IMP.err='';render();toast(pl.baru+pl.ubah+' data '+label.toLowerCase()+' berhasil diimpor.');go(t==='pinjaman'?'pinjaman':t==='kelas'?'kelas':t==='kategori'?'kategori':t);}
  else render();
}
async function downloadTemplate(){
  var sp=SPEC[IMP.tipe],name='template-impor-'+IMP.tipe;
  var rows=[sp.cols.map(function(c){return c.t;})].concat(sp.sample);
  if(typeof XLSX!=='undefined'){
    try{
      var ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=sp.cols.map(function(c){return {wch:Math.max(14,c.t.length+4)};});
      var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sp.label);
      var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      if(await saveFile(name+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})))toast('Template diunduh. Hapus baris contoh sebelum mengunggah.');
      return;
    }catch(e){}
  }
  var csv='﻿'+rows.map(function(r){return r.map(function(v){v=String(v);return /[";\n,]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(';');}).join('\r\n');
  if(await saveFile(name+'.csv',csv,'text/csv;charset=utf-8'))toast('Template diunduh. Hapus baris contoh sebelum mengunggah.');
}

function paintPie(){

    var n=+el.dataset.n,t0=performance.now(),dur=750;if(!n)return;
    el.textContent='0';
    (function tick(now){var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=String(Math.round(n*e));if(p<1&&document.contains(el))requestAnimationFrame(tick);else el.textContent=String(n);})(t0);
  });
}
function tiltInit(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cur=null,raf=0,last=null;
  function reset(el){if(!el)return;el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');}
  function apply(){
    raf=0;if(!cur||!last)return;
    var r=cur.getBoundingClientRect();if(!r.width||!r.height)return;
    var px=(last.clientX-r.left)/r.width-.5,py=(last.clientY-r.top)/r.height-.5,mx=+(cur.dataset.tilt||8);
    cur.style.setProperty('--ry',(px*2*mx).toFixed(2)+'deg');cur.style.setProperty('--rx',(-py*2*mx).toFixed(2)+'deg');
    cur.style.setProperty('--mx',((px+.5)*100).toFixed(1)+'%');cur.style.setProperty('--my',((py+.5)*100).toFixed(1)+'%');
  }
  document.addEventListener('pointermove',function(e){
    if(e.pointerType&&e.pointerType!=='mouse')return;
    var el=e.target.closest?e.target.closest('[data-tilt]'):null;
    if(cur&&cur!==el)reset(cur);
    cur=el;if(!el)return;last=e;if(!raf)raf=requestAnimationFrame(apply);
  });
  document.addEventListener('mouseleave',function(){reset(cur);cur=null;});
}
var raf=0;
function scheduleRender(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render();});}
function render(){
  if(!S.ready){renderChrome();$('#view').innerHTML='<div class="empty">Memuat data…</div>';return;}
  if(S.view==='scan'&&$('#scan-result')){renderChrome();refreshScan();return;}
  var ae=document.activeElement,keep=ae&&ae.id&&$('#view').contains(ae)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  renderChrome();
  var vw=$('#view');vw.classList.toggle('enter',!!S.enter);
  vw.innerHTML=VIEWS[S.view]();
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e);}catch(e){}}}
  drawBarcodes();drawCharts();
  if(S.enter){S.enter=false;countUp();}
  if(S.view==='scan')focusScan();
}
async function go(v){
  if(!VIEWS[v])return;
  if(S.cam)await camStop();
  S.view=v;S.enter=true;
  try{history.replaceState(null,'','#'+v);}catch(e){}
  $('#side').classList.remove('open');render();window.scrollTo(0,0);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('pustaka-tema',t);}catch(e){}
  render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act;
  if(act==='close-modal'){if(el.classList.contains('scrim')&&e.target!==el)return;closeModal();return;}
  if(act==='nav'){go(el.dataset.v);return;}
  if(act==='menu'){$('#side').classList.toggle('open');return;}
  if(act==='theme'){setTheme(effTheme()==='dark'?'light':'dark');return;}
  if(act==='petugas'){if(S.auth)openAccount();else openPetugas();return;}
  if(act==='logout'){logout();return;}
  if(act==='reload'){location.reload();return;}
  if(act==='add'){if(!guard())return;if(el.dataset.c==='pinjaman')openLoan();else openForm(el.dataset.c);return;}
  if(act==='edit'){if(!guard())return;openForm(el.dataset.c,el.dataset.id);return;}
  if(act==='school'){if(!guard())return;openSchool();return;}
  if(act==='card'){openCard(el.dataset.id);return;}
  if(act==='dl-card'){downloadCard(el.dataset.id);return;}
  if(act==='print'){window.print();return;}
  if(act==='print-cards'){printCards();return;}
  if(act==='csv'){exportCsv();return;}
  if(act==='xlsx'){exportXlsx();return;}
  if(act==='backup'){exportBackup();return;}
  if(act==='demo'){loadDemo();return;}
  if(act==='wipe'){openWipe();return;}
  if(act==='cam'){camToggle();return;}
  if(act==='imp-open'){IMP.tipe=el.dataset.v;IMP.plan=null;IMP.fileName='';IMP.err='';go('impor');return;}
  if(act==='imp-type'){IMP.tipe=el.dataset.v;IMP.plan=null;IMP.fileName='';IMP.err='';render();return;}
  if(act==='imp-template'){downloadTemplate();return;}
  if(act==='imp-go'){impGo();return;}
  if(act==='filter'){S.f[el.dataset.key]=el.dataset.val;render();return;}
  if(act==='scan-clear'){S.scan={anggotaId:null,bukuId:null};refreshScan();focusScan();return;}
  if(act==='scan-loan'){
    var a=byId('anggota',S.scan.anggotaId),b=byId('buku',S.scan.bukuId);if(!a||!b)return;
    if(activeLoan(b.id)){toast('Buku ini sedang dipinjam.','err');return;}
    var t=today();
    put('pinjaman',uid('p'),{anggotaId:a.id,bukuId:b.id,tglPinjam:t,tenggat:addDays(t,LOAN_DAYS),tglKembali:null},'pinjam').then(function(ok){
      if(ok){toast(b.judul+' dipinjamkan ke '+a.nama+'. Tenggat '+fmt(addDays(t,LOAN_DAYS))+'.');S.scan.bukuId=null;refreshScan();focusScan();}
    });
    return;
  }
  if(act==='return'){
    var p=byId('pinjaman',el.dataset.id);if(!p)return;
    patch('pinjaman',p.id,{tglKembali:today()},'kembali').then(function(ok){
      if(ok){toast('Buku dikembalikan.');if(S.scan.bukuId===p.bukuId)S.scan.bukuId=null;refreshScan();focusScan();}
    });
    return;
  }
  if(act==='del'){
    var c=el.dataset.c,id=el.dataset.id;
    if(el.dataset.armed){
      var why=DEPS[c](id);if(why){toast(why,'err');render();return;}
      var gone=c==='admin'?(byId('admin',id)||{}).nama:null;
      drop(c,id).then(function(ok){if(ok){toast('Data dihapus.');if(!S.auth&&gone&&gone===S.petugas){setPetugas(null);render();openPetugas();}}});
      return;
    }
    el.dataset.armed='1';el.classList.add('armed');var old=el.innerHTML;el.innerHTML='Hapus?';
    setTimeout(function(){if(document.contains(el)){delete el.dataset.armed;el.classList.remove('armed');el.innerHTML=old;}},3000);
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='login-form'){e.preventDefault();doLogin();return;}
  if(e.target.id==='scan-form'){e.preventDefault();var i=$('#scan-in');handleScan(i.value);i.value='';focusScan();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id&&t.id.indexOf('q-')===0){S.q[t.id.slice(2)]=t.value;render();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-anggotaKelas'&&!t.closest('#m-form')){S.f.anggotaKelas=t.value;render();}
  if(t.id==='f-riwayat'&&!t.closest('#m-form')){S.f.riwayat=t.value;render();}

  if(t.name==='imp-mode'){IMP.mode=t.value;render();}
});
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',function(e){
  var d=e.target.closest&&e.target.closest('.drop');if(!d)return;
  e.preventDefault();d.classList.remove('over');
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)impLoad(f);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();$('#side').classList.remove('open');}
  if(e.key==='Tab'){
    var m=$('.modal');if(!m)return;
    var f=Array.prototype.filter.call(m.querySelectorAll('button,input,select'),function(x){return !x.disabled&&x.offsetParent!==null;});
    if(!f.length)return;var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
  }
});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(VIEWS[v]&&v!==S.view)go(v);});
try{var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',function(){render();});}catch(e){}

/* ---------- Firebase (GitHub Pages, data online) ---------- */
function fbConfigured(){var c=window.PUSTAKA_FIREBASE;return !!(c&&c.apiKey&&c.projectId);}
function loadScript(src){return new Promise(function(res,rej){var el=document.createElement('script');el.src=src;el.onload=res;el.onerror=function(){rej(new Error('gagal memuat '+src));};document.head.appendChild(el);});}
async function ensureFirebase(){
  if(typeof firebase!=='undefined'&&firebase.auth&&firebase.firestore)return;
  var base='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-firestore-compat.js')]);
}
function petugasName(){
  var u=S.user;if(!u)return S.petugas;
  var em=String(u.email||'').toLowerCase();
  var a=S.admin.find(function(x){return x.email&&String(x.email).toLowerCase()===em;});
  return a?a.nama:(u.displayName||u.email||'Petugas');
}
var CREDIT='Design by Akhmad Fitra Harry, S.Pd';
function loginRoot(){var r=$('#login-root');if(!r){r=document.createElement('div');r.id='login-root';document.body.appendChild(r);}return r;}
function hideLogin(){var r=$('#login-root');if(r)r.innerHTML='';}
function fatal(msg){loginRoot().innerHTML='<div class="login"><div class="login-card"><div class="brand-mark lg">'+icon('alert')+'</div><h2>Halaman belum bisa dibuka</h2><p class="sub">'+esc(msg)+'</p><button class="btn primary" data-act="reload">Muat ulang</button><p class="login-credit">'+CREDIT+'</p></div></div>';}
function showLogin(msg){
  loginRoot().innerHTML='<div class="login"><div class="login-wrap"><div class="login-stage" aria-hidden="true">'+bookHTML('b1')+'</div><form class="login-card" id="login-form" data-tilt="4" novalidate><div><h2>PUSTAKA</h2><p class="sub">'+esc(school().nama)+'</p></div><p class="sub">Masuk dengan akun petugas untuk membuka data perpustakaan.</p>'+
    '<div class="field"><label for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="username" autocapitalize="off" required></div>'+
    '<div class="field"><label for="lg-pass">Kata sandi</label><input id="lg-pass" type="password" autocomplete="current-password" required></div>'+
    '<p class="form-err" id="lg-err" role="alert"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</p><button class="btn primary" type="submit">Masuk</button><p class="login-credit">'+CREDIT+'</p></form></div></div>';
  var i=$('#lg-email');if(i)i.focus();
}
async function doLogin(){
  var em=($('#lg-email').value||'').trim(),pw=$('#lg-pass').value||'',err=$('#lg-err'),btn=$('#login-form button[type=submit]');
  if(!em||!pw){err.textContent='Isi email dan kata sandi.';err.hidden=false;return;}
  btn.disabled=true;err.hidden=true;
  try{await S.fbAuth.signInWithEmailAndPassword(em,pw);}
  catch(e){
    var c=String(e&&e.code||'');
    err.textContent=/invalid|wrong-password|user-not-found/.test(c)?'Email atau kata sandi salah.':c==='auth/too-many-requests'?'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.':c==='auth/network-request-failed'?'Tidak ada koneksi internet.':c==='auth/user-disabled'?'Akun ini dinonaktifkan.':'Gagal masuk. Coba lagi.';
    err.hidden=false;btn.disabled=false;
  }
}
function openAccount(){
  var u=S.user||{};
  openModal({title:'Akun Petugas',body:'<dl class="dl"><dt>Nama</dt><dd>'+esc(S.petugas||'–')+'</dd><dt>Email</dt><dd>'+esc(u.email||'–')+'</dd></dl><p class="sub">Semua perubahan data tercatat atas nama ini di menu Riwayat.</p>',
    footer:'<button type="button" class="btn ghost" data-act="close-modal">Tutup</button><button type="button" class="btn primary" data-act="logout">Keluar</button>'});
}
async function logout(){try{await S.fbAuth.signOut();}catch(e){}location.reload();}
async function bootFirebase(){
  S.auth=true;S.ready=false;render();
  try{await ensureFirebase();}
  catch(e){fatal('Firebase tidak bisa dimuat. Periksa koneksi internet lalu muat ulang halaman.');return;}
  try{
    if(!(firebase.apps&&firebase.apps.length))firebase.initializeApp(window.PUSTAKA_FIREBASE);
    S.fbAuth=firebase.auth();
  }catch(e){fatal('Pengaturan Firebase tidak valid. Periksa isi PUSTAKA_FIREBASE di bagian atas file index.html.');return;}
  S.fbAuth.onAuthStateChanged(function(user){
    if(user){
      S.user=user;S.petugas=petugasName();hideLogin();
      if(!S.db){
        S.db=firebase.firestore();subscribeAll();
        setTimeout(function(){if(!S.ready){S.ready=true;S.dbState='error';render();}},15000);
      }else render();
    }else{S.user=null;showLogin('');}
  });
}

/* ---------- boot ---------- */
async function boot(){
  tiltInit();
  try{var tema=localStorage.getItem('pustaka-tema');if(tema==='dark'||tema==='light')document.documentElement.setAttribute('data-theme',tema);}catch(e){}
  S.lap.sampai=today();
  var h=location.hash.slice(1);if(VIEWS[h])S.view=h;
  readPetugas();
  if(IN_CLAUDE){
    S.ready=false;render();
    try{
      var res=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);
      S.dl=res[2]||null;
      if(res[0]){
        S.db=res[0];
        if(res[1]){try{var cw=await res[1].can('data.write');S.canWrite=cw!==false;}catch(e){}}
        subscribeAll();
        setTimeout(function(){if(!S.ready){S.ready=true;S.dbState='error';render();}},15000);
        return;
      }
    }catch(e){}
  }
  if(!IN_CLAUDE&&fbConfigured()){await bootFirebase();return;}
  loadLocal();
  if(S.petugas&&!S.admin.some(function(a){return a.nama===S.petugas;}))setPetugas(null);
  S.ready=true;render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if(!S.petugas)openPetugas();
}
boot();
})();
